services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autoprice
      POSTGRES_USER: autoprice
      POSTGRES_PASSWORD: autoprice
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoprice"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/autoprice
      DATABASE_USER: autoprice
      DATABASE_PASSWORD: autoprice
      REDIS_HOST: redis
      CORS_ORIGINS: http://localhost:3000
      COLLECTOR_URL: http://collectors:8090
      ADMIN_USER: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      BACKEND_INTERNAL_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

  collectors:
    build: ./collectors
    environment:
      DATABASE_URL: postgresql://autoprice:autoprice@postgres:5432/autoprice
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
