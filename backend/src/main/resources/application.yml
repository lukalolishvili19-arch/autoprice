spring:
  application:
    name: autoprice-api
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/autoprice}
    username: ${DATABASE_USER:autoprice}
    password: ${DATABASE_PASSWORD:autoprice}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  cache:
    type: none

server:
  port: ${PORT:8080}

app:
  cors-origins: ${CORS_ORIGINS:http://localhost:3000}
  collector-url: ${COLLECTOR_URL:http://localhost:8090}
  admin-user: ${ADMIN_USER:admin}
  admin-password: ${ADMIN_PASSWORD:changeme}

logging:
  level:
    ge.autoprice: INFO
    org.springframework.security: WARN
